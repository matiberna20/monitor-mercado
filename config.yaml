alertas:
  # Cada cuántos minutos se consultan los precios.
  intervalo_minutos: 5
  # true = solo consulta cada activo mientras su bolsa está abierta.
  solo_en_horario_de_mercado: true
  # Minutos extra después del cierre (los datos gratis llegan con demora).
  margen_minutos_post_cierre: 20
  # Para alertas que se repiten: tiempo mínimo entre dos avisos de la misma alerta.
  enfriamiento_minutos_repetir: 60

monedas:
  # Tipo de cambio para pasar pesos a dólares: "ccl" (contado con liqui, el que
  # usa el mercado de acciones) u "oficial".
  dolar_ars: ccl
  # El CCL se calcula como: precio local * ratio / precio del ADR.
  ccl_accion_local: GGAL.BA
  ccl_adr: GGAL
  ccl_ratio: 10
  # Símbolo en BYMA cuando no es simplemente "SIMBOLO.BA" (sin guiones).
  simbolos_byma:
    YPF: YPFD.BA

avisos:
  # Canal por donde salen los avisos (por ahora solo Telegram).
  canal: telegram

rutas:
  base_de_datos: data/monitor.db
  logs: logs
