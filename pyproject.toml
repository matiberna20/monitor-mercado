[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-mercado"
version = "0.1.0"
description = "Seguimiento y análisis de activos financieros con avisos por Telegram (uso personal, no es asesoramiento financiero)."
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.50",
    "python-telegram-bot[job-queue]>=21.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tenacity>=8.2",
    "httpx>=0.27",
    "tzdata",  # Windows no trae la base de husos horarios IANA; zoneinfo la necesita.
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
monitor = "monitor_mercado.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
