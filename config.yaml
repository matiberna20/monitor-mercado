# Configuración general del monitor. Las claves secretas NO van acá: van en .env.

# Qué lista usa el sistema por defecto: "prueba" (10 símbolos) o "completa".
modo_watchlist: prueba

watchlist_prueba:
  - AAPL      # EE.UU. (Nasdaq)
  - NVDA      # EE.UU. (Nasdaq)
  - SPY       # ETF del S&P 500
  - GGAL      # ADR argentino (NASDAQ)
  - YPF       # ADR argentino (NYSE)
  - ALUA.BA   # Acción argentina (BYMA, cotiza en pesos)
  - PETR4.SA  # Acción brasileña (B3, cotiza en reales)
  - VOW3.DE   # Acción alemana (Xetra, cotiza en euros)
  - BARC.L    # Acción británica (Londres, cotiza en peniques)
  - BRK-B     # Símbolo con guion (en BYMA el CEDEAR es BRKB.BA)

