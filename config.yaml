alertas:
  # Cada cuántos minutos se consultan los precios.
  intervalo_minutos: 1
  # true = solo consulta cada activo mientras su bolsa está abierta.
  solo_en_horario_de_mercado: true
  # Minutos extra después del cierre (los datos gratis llegan con demora).
  margen_minutos_post_cierre: 20
  # Para alertas que se repiten: tiempo mínimo entre dos avisos de la misma alerta.
  enfriamiento_minutos_repetir: 60

monedas:
  # Tipo de cambio para pasar pesos a dólares: "ccl" (contado con liqui, el que
  # usa el mercado de acciones) u "oficial".
  dolar_ars: ccl
  # El CCL se calcula como: precio local * ratio / precio del ADR.
  ccl_accion_local: GGAL.BA
  ccl_adr: GGAL
  ccl_ratio: 10
  # Símbolo en BYMA cuando no es simplemente "SIMBOLO.BA" (sin guiones).
  simbolos_byma:
    YPF: YPFD.BA

tecnico:
  # Años de historia diaria que se descargan la primera vez.
  anios_historia: 10
  # Horas antes de volver a actualizar el historial guardado.
  refresco_horas: 6
  # true = las acciones argentinas en pesos se analizan en dólares CCL, para que
  # la inflación no parezca una tendencia alcista.
  ars_en_dolares_ccl: true
  # Puntaje (de -1 a 1) a partir del cual la señal deja de ser "neutral".
  umbral_tendencia: 0.2
  # Cuántas ruedas hacia atrás se buscan patrones (cruces, rupturas, velas).
  ruedas_patrones: 5
  # Ruedas que se muestran en el gráfico (~180 = 9 meses).
  ruedas_grafico: 180

noticias:
  habilitado: true
  # true = clasificar el sentimiento de cada titular con la API de Claude (servicio
  # pago, requiere ANTHROPIC_API_KEY). false = solo se muestran los titulares.
  usar_claude: false
  # Días hacia atrás que se buscan noticias.
  dias: 7
  # Máximo de titulares por activo que se clasifican (controla el costo).
  max_noticias: 25
  # Modelo de Claude que clasifica el sentimiento y nivel de razonamiento.
  # "low" alcanza para clasificar titulares y es lo más barato.
  modelo: claude-opus-5-5
  esfuerzo: low
  # Peso máximo de las noticias en la señal final (el resto es análisis técnico).
  peso_en_senal: 0.3
  # Una noticia de hace "vida_media_dias" pesa la mitad que una de hoy.
  vida_media_dias: 2
  # Nombre con el que se busca cada empresa (si no está, se toma de Yahoo).
  nombres:
    ALUA.BA: Aluar
    GGAL: Grupo Financiero Galicia
    BMA: Banco Macro
    YPF: YPF
    PETR4.SA: Petrobras
    PBR: Petrobras
    BBDC4.SA: Bradesco
    XP: XP Inc
    VOW3.DE: Volkswagen
    BARC.L: Barclays
    BRK-B: Berkshire Hathaway
    MELI: Mercado Libre
    GLOB: Globant
    GOOGL: Alphabet
    GOOG: Alphabet
    META: Meta Platforms
    B: Barrick
    TS: Tenaris
    VIST: Vista Energy
    NFLX: Netflix
    # ETFs: se buscan noticias del tema que siguen, no del fondo en sí.
    NUGT: gold miners
    SLV: silver prices
    GBTC: Bitcoin
    BTC: Bitcoin
    SPY: Wall Street
    IWM: small caps
  # Idioma de búsqueda en Google News: es (medios argentinos), pt (brasileños), en.
  # Por defecto: .BA -> es, .SA -> pt, el resto -> en.
  idiomas:
    GGAL: es
    BMA: es
    YPF: es
    PBR: pt
    XP: pt
  # Mail de contacto que exige la SEC para consultar EDGAR (hechos relevantes 8-K
  # de empresas de EE.UU.). Vacío = EDGAR desactivado.
  sec_contacto: "mati.berna20@gmail.com"

resultados:
  # Empresas cuyos resultados seguís (te avisa antes y después de que presenten).
  # También podés agregar o quitar desde Telegram con /seguir y /dejar.
  empresas: [AAPL, NVDA, GGAL, YPF, MELI, PETR4.SA]
  # Cada cuántas horas se revisa el calendario de resultados.
  revision_horas: 2
  # Con cuánta anticipación te avisa que una empresa va a presentar.
  aviso_previo_horas: 36
  # Mail de contacto que exige la SEC para descargar comunicados (8-K / 6-K).
  # Vacío = no se analizan comunicados (no hay guidance ni tono).
  sec_contacto: "mati.berna20@gmail.com"
  # true = Claude lee el comunicado y detecta guidance y tono (pago, requiere
  # ANTHROPIC_API_KEY). false = el reporte trae el link al comunicado para leerlo vos.
  usar_claude: false
  # Modelo de Claude que lee el comunicado ("medium": textos largos y más matices).
  modelo: claude-opus-5-5
  esfuerzo: medium
  # Pares para comparar la valuación. Si una empresa no está acá, se usan las de tu
  # watchlist de la misma industria o sector (ver 'monitor actualizar-sectores').
  pares:
    AAPL: [MSFT, GOOGL, META, AMZN, SONY]
    NVDA: [AMD, AVGO, TSM, INTC, MU, ASML]
    GGAL: [BMA, BAC, JPM, XP]
    YPF: [PBR, XOM, CVX, SHEL]
    MELI: [AMZN, SHOP, JMIA]
    PETR4.SA: [YPF, XOM, CVX, SHEL]

backtest:
  # Walk-forward: años para elegir parámetros y años para probarlos fuera de muestra.
  anios_entrenamiento: 3
  anios_prueba: 1
  # Comisión por cada compra o venta, según el mercado (0.006 = 0,6%).
  comisiones:
    EE.UU.: 0.001
    BYMA: 0.006
    B3: 0.003
    Xetra: 0.002
    Londres: 0.002
  # Diferencia entre el precio esperado y el conseguido al operar (0.0005 = 0,05%).
  slippage: 0.0005
  # true = también apuesta a la baja (corto) cuando la señal es bajista.
  permitir_corto: false
  # Días hacia adelante para medir si la señal "acertó" la dirección.
  horizonte_dias: 20

cartera:
  # Archivo con tus posiciones (no se sube a Git: es información personal).
  archivo: mi_cartera.csv
  # Resumen automático al cierre, por Telegram (con el bot abierto).
  resumen_diario: true
  # Hora del resumen, en hora de Nueva York (16:20 NY = 17:20 Argentina, 20 min después del cierre).
  hora_resumen: "16:20"
  # Cuántas noticias importantes incluir como máximo.
  noticias_maximas: 8
  # Avisa si una posición pesa más que esto en la cartera (0.25 = 25%).
  concentracion_maxima: 0.25
  # Destaca las acciones que se movieron más que esto en el día (0.05 = 5%).
  umbral_movimiento: 0.05
  # Stops que se aplican a TODAS las posiciones que no tengan uno propio (en %).
  # Vacío = ninguno. Los que pongas con /stop o /trailing tienen prioridad.
  stop_loss_por_defecto:      # ej. 15 = avisa si cae 15% desde tu precio de compra
  trailing_por_defecto:       # ej. 20 = avisa si cae 20% desde su máximo

rebalanceo:
  # Solo sugiere compras o ventas si un peso se desvía más que esto del objetivo (0.05 = 5 puntos).
  tolerancia: 0.05
  # Peso objetivo (0.20 = 20%) por símbolo o por grupo. Vacío = sin rebalanceo.
  # Los grupos de cada bolsa existen solos: "EE.UU.", "BYMA", "B3", "Xetra", "Londres".
  objetivos: {}
  #   NUGT: 0.20
  #   Argentina: 0.25
  # Grupos propios (opcional): un símbolo que no está acá pertenece al grupo de su bolsa.
  grupos: {}
  #   Argentina: [GGAL, BMA, YPF, VIST, TS]

avisos:
  # Canal por donde salen los avisos (por ahora solo Telegram).
  canal: telegram

rutas:
  base_de_datos: data/monitor.db
  historico: data/historico
  graficos: data/graficos
  logs: logs
